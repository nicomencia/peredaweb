# Daily end-to-end check of the live site (scripts/verify-live.mjs): pages and
# statuses, indexing, sitemap/robots, http -> https and apex -> www, all 755 old
# URLs, the API, caching and the private files. A failure (site down, a redirect
# broken, certificate expired) makes the run fail, and GitHub emails the repo
# owner. Read-only: it submits nothing and never logs in.
name: Monitor www

on:
  schedule:
    - cron: '17 6 * * *'   # every day, 06:17 UTC
  workflow_dispatch:        # "Run workflow" button, for a check on demand

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify www.saneamientos-pereda.com
        run: node scripts/verify-live.mjs

      - name: Verify staging
        run: node scripts/verify-live.mjs --dev
